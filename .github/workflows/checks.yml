name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Graph checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install Python
        run: uv python install

      - name: Install API dependencies
        run: uv sync --project apps/api --frozen

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the local database
        run: docker compose up -d --wait falkordb

      - name: Run graph schema checks
        run: uv run --project apps/api pytest apps/api/tests/test_graph_schema.py -q

      - name: Run Python lint
        run: uv run --project apps/api ruff check apps/api/wsw_brain apps/api/tests/test_graph_schema.py

      - name: Show database diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Stop services
        if: always()
        run: docker compose down -v
